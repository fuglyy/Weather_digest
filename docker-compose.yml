version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: weather-digest-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-weather_digest}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-weather_digest}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
